name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# An explicit 'bash' shell opts every run step into -o pipefail (the
# implicit default is plain 'bash -e', without it): several steps pipe
# through tee, and the pipe must not mask the real command's exit — a
# failing perf suite or a regressing perfcompare gate would otherwise
# report tee's success.
defaults:
  run:
    shell: bash

# Supersede stale runs of the same ref; never cancel master pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: Verify gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::files are not gofmt'd:"
            echo "$out"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test (race detector)
        run: go test -race -count=1 ./...
      # The extracted mechanism packages carry the engine's subtlest
      # invariants; their coverage is held at 100% so a new branch cannot
      # land untested.
      - name: Primitive coverage gate
        run: |
          go test -coverprofile=/tmp/prim.cov \
            ./internal/ledger/ ./internal/watchset/ ./internal/tokenpool/ ./internal/dispatcher/
          total=$(go tool cover -func=/tmp/prim.cov | awk '/^total:/{print $NF}')
          echo "primitive coverage: $total"
          if [ "$total" != "100.0%" ]; then
            go tool cover -func=/tmp/prim.cov | grep -v '100.0%'
            echo "::error::internal primitive coverage is $total, want 100.0%"
            exit 1
          fi
      # Ten seconds per target is a smoke pass over the invariant
      # checkers; long fuzz sessions run locally.
      - name: Fuzz smoke (primitives)
        run: |
          go test -fuzz=FuzzReconcile -fuzztime=10s ./internal/ledger/
          go test -fuzz=FuzzOps -fuzztime=10s ./internal/tokenpool/
          go test -fuzz=FuzzOps -fuzztime=10s ./internal/watchset/
          go test -fuzz=FuzzRoundTrip -fuzztime=10s ./internal/storagepb/
          go test -run xxx -fuzz=FuzzStoreContract -fuzztime=10s ./bboltstore/
      - name: Benchmarks compile and run once
        run: go test -run xxx -bench . -benchtime 1x ./...
      - name: Example smoke test
        run: go run ./examples/machines

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Tool versions come from go.mod tool directives (single source of
      # truth, bumped by dependabot's gomod updates).
      - name: Staticcheck
        run: go tool staticcheck ./...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go tool govulncheck ./...

  proto:
    name: Protobuf lint, breaking & drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so buf breaking can diff against the base branch.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
          version: 1.72.0
      - name: Lint
        run: buf lint
      - name: Format
        run: buf format --diff --exit-code
      - name: Breaking changes against base branch
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }}"
      # buf.gen.yaml invokes protoc-gen-go via 'go tool', so its version is
      # locked to go.mod's protobuf runtime — nothing to install or match.
      - name: Generated code drift
        run: |
          buf generate
          # git status --porcelain, not git diff: newly generated files are
          # untracked, and a diff-only check would miss them entirely.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::generated code is out of date; run 'buf generate' and commit the result"
            exit 1
          fi

  perf:
    name: Performance regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the base-branch merge-base can be checked out.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run suite (head only, master push)
        if: github.event_name == 'push'
        run: go test -run xxx -bench . -benchtime 1x -count 3 -benchmem ./perf/ | tee /tmp/perf-head.txt
      # Head and base alternate in adjacent time slices so both sides
      # sample the same runner weather (CPU contention, disk-throttling
      # phases): sequential whole-suite blocks have repeatedly produced
      # 2-7x wall-clock splits on identical code when the runner degraded
      # during exactly one of the blocks.
      - name: Run suites (interleaved with base)
        if: github.event_name == 'pull_request'
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          git worktree add /tmp/base-tree "$base"
          if [ ! -d /tmp/base-tree/perf ]; then
            echo "no perf suite on base commit; head-only run"
            go test -run xxx -bench . -benchtime 1x -count 3 -benchmem ./perf/ | tee /tmp/perf-head.txt
            exit 0
          fi
          # Five slices so the paired median needs three noisy slices to
          # mislead (three slices needed only two), alternating which
          # side runs first so bursty stalls have no systematic side to
          # land on.
          for i in 1 2 3 4 5; do
            if [ $((i % 2)) -eq 1 ]; then
              go test -run xxx -bench . -benchtime 1x -count 1 -benchmem ./perf/ | tee -a /tmp/perf-head.txt
              (cd /tmp/base-tree && go test -run xxx -bench . -benchtime 1x -count 1 -benchmem ./perf/) | tee -a /tmp/perf-base.txt
            else
              (cd /tmp/base-tree && go test -run xxx -bench . -benchtime 1x -count 1 -benchmem ./perf/) | tee -a /tmp/perf-base.txt
              go test -run xxx -bench . -benchtime 1x -count 1 -benchmem ./perf/ | tee -a /tmp/perf-head.txt
            fi
          done
      - name: Gate against base
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f /tmp/perf-base.txt ]; then
            echo "### Performance suite: no baseline on base branch" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # transitions/* gate two-sided at 0.1% (exactly deterministic),
          # disk bytes (best sample) and allocations at 10%, wall clock
          # at 25% on paired per-slice head/base ratios (50% best-sample
          # fallback when pairing is unavailable); the thresholds live in
          # internal/perfcompare, which also fails on recorded test
          # failures and on gated metrics missing from head.
          go run ./internal/perfcompare /tmp/perf-base.txt /tmp/perf-head.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report (master)
        if: github.event_name == 'push'
        run: go run ./internal/perfcompare -report /tmp/perf-head.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-${{ github.sha }}
          path: /tmp/perf-head.txt
