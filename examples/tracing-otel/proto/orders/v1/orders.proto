// The fulfill-order pipeline: a classic order-fulfillment saga used by
// the OpenTelemetry tracing example. Stock is reserved and payment
// charged with unwind compensation (release, refund); shipping failure
// unwinds both.
syntax = "proto3";

package orders.v1;

import "durable/v1/options.proto";

option go_package = "github.com/dangra/durable/examples/tracing-otel/orderspb;orderspb";

message FulfillOrderInput {
  string sku = 1;
  uint32 quantity = 2;
  uint64 amount_cents = 3;
  string ship_to = 4;
}

message FulfillOrderOutput {
  string shipment_id = 1;
}

message ReserveStock {
  option (durable.v1.step) = {
    id: "reserve-stock/v1"
    unwind: true
  };

  string reservation_id = 1;
}

message ChargePayment {
  option (durable.v1.step) = {
    id: "charge-payment/v1"
    unwind: true
  };

  string charge_id = 1;
}

message Ship {
  option (durable.v1.step) = {id: "ship/v1"};

  string shipment_id = 1;
}

message FulfillOrder {
  option (durable.v1.pipeline) = {
    id: "fulfill-order"
    input: ".orders.v1.FulfillOrderInput"
    output: ".orders.v1.FulfillOrderOutput"

    steps: ".orders.v1.ReserveStock"
    steps: ".orders.v1.ChargePayment"
    steps: ".orders.v1.Ship"
  };
}
