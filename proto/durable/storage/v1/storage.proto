// Storage encoding of durable run records.
//
// This schema is internal to this module's store implementations; it is
// not part of the durable public API. Wire enum values are decoupled from
// the Go constants by an explicit conversion layer in internal/storagepb.
//
// A run is persisted as components with distinct write cadences: RunMeta
// once at creation, StepRecord rows once per operation resolution,
// Failures/Terminal/CancelRequest rarely — and Cursor, the only component
// rewritten on every attempt, kept deliberately small so per-attempt write
// volume is independent of input and state sizes.
syntax = "proto3";

package durable.storage.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/dangra/durable/internal/storagepb;storagepb";

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_FORWARD = 1;
  PHASE_UNWIND = 2;
  PHASE_DONE = 3;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_SUCCESS = 1;
  OUTCOME_FAILURE = 2;
}

enum OpStatus {
  // UNSPECIFIED doubles as "operation never started".
  OP_STATUS_UNSPECIFIED = 0;
  OP_STATUS_UNRESOLVED = 1;
  OP_STATUS_SUCCEEDED = 2;
  OP_STATUS_FAILED = 3;
}

enum FailureKind {
  // UNSPECIFIED decodes as the Go default, system.
  FAILURE_KIND_UNSPECIFIED = 0;
  FAILURE_KIND_SYSTEM = 1;
  FAILURE_KIND_USER = 2;
  FAILURE_KIND_CANCELED = 3;
}

// RunMeta holds the write-once identity of a run.
message RunMeta {
  string run_id = 1;
  string pipeline_id = 2;
  string resource_id = 3;
  // Namespaced slot group ("pipeline/<id>" or "group/<name>").
  string slot_group = 4;
  bytes input = 5;
  google.protobuf.Timestamp created_at = 6;
}

// Cursor is the per-run scheduling state rewritten on every attempt.
message Cursor {
  Phase phase = 1;
  // The single in-flight operation; empty when none. Forward vs unwind
  // follows from phase.
  string step_id = 2;
  uint64 attempts = 3;
  google.protobuf.Timestamp next_attempt_at = 4;
  string last_error = 5;
  string last_reason = 6;
  google.protobuf.Timestamp last_error_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Parks the in-flight operation until this run terminates.
  string awaiting_run_id = 9;
}

message StepRecord {
  OpStatus forward_status = 1;
  uint64 forward_attempts = 2;
  bytes state = 3;
  OpStatus unwind_status = 4;
  uint64 unwind_attempts = 5;
}

message FailureRecord {
  string step_id = 1;
  Phase phase = 2;
  uint64 attempt = 3;
  string message = 4;
  google.protobuf.Timestamp at = 5;
  FailureKind kind = 6;
  string reason = 7;
}

message Failures {
  FailureRecord root = 1;
  repeated FailureRecord unwind = 2;
}

// Terminal marks a run's committed terminal outcome and output.
message Terminal {
  Outcome outcome = 1;
  bytes output = 2;
}

message CancelRequest {
  string cause = 1;
  google.protobuf.Timestamp at = 2;
}
