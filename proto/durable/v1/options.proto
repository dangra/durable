// Protobuf extensions declaring durable Pipelines and Steps.
//
// See spec/05-codegen.md.
syntax = "proto3";

package durable.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/dangra/durable/durablepb;durablepb";

// StepOptions declares a protobuf message as a durable Step.
message StepOptions {
  // Durable Step identity, e.g. "reserve-capacity/v1". Required.
  string id = 1;

  // Whether successful forward execution may later participate in unwind.
  bool unwind = 2;

  // Whether the Step is retired: structurally present, but no new forward
  // operation may begin for it.
  bool retired = 3;

  // Optional named concurrency class. Operations of steps sharing a class
  // are bounded by the capacity the engine configures for it
  // (WithConcurrencyClass); a declared class without configured capacity
  // is unlimited. Overrides the pipeline-level default.
  string concurrency_class = 4;
}

// PipelineOptions declares a protobuf marker message as a durable Pipeline.
message PipelineOptions {
  // Durable Pipeline identity, e.g. "provision-machine". Required.
  string id = 1;

  // Fully-qualified Input message type, e.g. ".machines.v1.ProvisionMachineInput".
  string input = 2;

  // Fully-qualified Output message type.
  string output = 3;

  // Ordered Step topology as fully-qualified Step message types.
  repeated string steps = 4;

  // Optional default concurrency class for all of this pipeline's steps;
  // a step's own concurrency_class overrides it.
  string concurrency_class = 6;

  // Mutex names this pipeline's Runs hold on their ResourceID, from
  // admission to terminality. Schedule is refused while any pipeline
  // naming the same mutex holds it for that resource; the
  // ScheduleConflictError names the holding Run so the caller can park
  // on it. Two pipelines exclude each other exactly when they share at
  // least one name. A pipeline always excludes with itself, with or
  // without mutexes.
  repeated string mutexes = 7;

  // Fully-qualified failure Output message type, optional. When set, a
  // failure reducer folds the immutable Input, the committed Step States,
  // the Run's Failure, and the permanent unwind failures into it when the
  // unwind completes, the way the reducer folds the Output on success;
  // Result.FailureOutput carries it.
  string failure_output = 8;
}

extend google.protobuf.MessageOptions {
  // NOTE: these numbers are in the 50000-99999 range reserved for
  // organization-internal use. Before publishing, replace them with
  // globally allocated extension numbers from the protobuf global
  // extension registry.
  StepOptions step = 51841;
  PipelineOptions pipeline = 51842;
}
